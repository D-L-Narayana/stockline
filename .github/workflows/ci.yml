name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=app --cov-report=term-missing
      - name: Smoke-test the server
        run: |
          STOCKLINE_DB=/tmp/s.db uvicorn app.main:app --port 8765 & sleep 3
          curl -sf http://localhost:8765/health
          curl -sf http://localhost:8765/reports/reorder > /dev/null
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stockline .
